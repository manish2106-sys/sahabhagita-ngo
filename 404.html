<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — Sahabhagita</title>
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0F2640 0%, #1B3A5C 40%, #2A5A8C 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }
        .error-page h1 { font-size: 120px; font-weight: 800; opacity: 0.3; }
        .error-page h2 { font-size: 28px; font-weight: 600; margin: 12px 0 16px; }
        .error-page p { color: rgba(255,255,255,0.7); margin-bottom: 32px; max-width: 400px; }
        .error-page a {
            display: inline-block;
            background: #E8612D;
            color: #fff;
            padding: 14px 32px;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.3s;
        }
        .error-page a:hover { background: #D14E1E; }
    </style>
</head>
<body>
    <div class="error-page">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>The page you're looking for doesn't exist. Let's get you back to making a difference.</p>
        <a href="/">← Back to Home</a>
    </div>
</body>
</html>
